name: pollo-city

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/pollotherunner/pollo-city:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      HTTP_ADDR: :8080
      PUBLIC_DIR: /app/public
      DATABASE_PATH: /data/pollo.db
      UPLOADS_DIR: /data/uploads
    volumes:
      - app_data:/data
    expose:
      - "8080"
    restart: unless-stopped
    mem_limit: ${APP_MEMORY_LIMIT:-192m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    mem_limit: ${CADDY_MEMORY_LIMIT:-96m}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  app_data:
  caddy_data:
  caddy_config:
