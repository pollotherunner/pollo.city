<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pollo.city</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#ffffff">
  <script src="/assets/theme-init.js"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body id="top" data-page="post">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div data-site-header></div>

  <main id="conteudo">
    <div class="reading-progress" aria-hidden="true"><span data-progress-bar></span></div>
    <article id="article" hidden>
      <header class="article-head">
        <a class="back-link" href="/#artigos"><i data-lucide="arrow-left"></i>Voltar aos artigos</a>
        <div class="article-meta" id="article-meta"></div>
        <h1 class="article-title" id="article-title"></h1>
        <p class="article-deck" id="article-deck"></p>
        <div class="article-byline" id="article-byline"></div>
        <div class="article-audio" id="article-audio" hidden>
          <div class="article-audio-head">
            <span class="article-audio-label"><i data-lucide="volume-2"></i>Ouça este artigo</span>
            <label class="article-audio-rate">
              <span class="sr-only">Velocidade de reprodução</span>
              <select id="article-audio-rate" aria-label="Velocidade de reprodução">
                <option value="0.5">0,5×</option>
                <option value="0.75">0,75×</option>
                <option value="1" selected>1×</option>
                <option value="1.25">1,25×</option>
                <option value="1.5">1,5×</option>
                <option value="1.75">1,75×</option>
                <option value="2">2×</option>
              </select>
            </label>
          </div>
          <div class="article-audio-player">
            <button class="article-audio-play" id="article-audio-play" type="button" aria-label="Reproduzir áudio">
              <span class="article-audio-icon article-audio-icon--play"><i data-lucide="play"></i></span>
              <span class="article-audio-icon article-audio-icon--pause"><i data-lucide="pause"></i></span>
            </button>
            <div class="article-audio-wave-wrap">
              <div class="article-audio-wave" id="article-audio-wave" aria-hidden="true"></div>
              <input class="article-audio-seek" id="article-audio-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Progresso do áudio">
            </div>
            <div class="article-audio-meta">
              <span id="article-audio-current">0:00</span>
              <span id="article-audio-duration">0:00</span>
            </div>
          </div>
          <audio id="article-audio-source" preload="metadata" hidden></audio>
        </div>
      </header>
      <div class="prose" id="article-body"></div>
    </article>

    <section class="comments-section" id="comentarios" aria-labelledby="comments-title" hidden>
      <div class="comments-inner">
        <header class="comments-heading">
          <h2 class="comments-title" id="comments-title">Comentários <span class="comment-count" data-comment-count>0</span></h2>
        </header>

        <form class="comment-form" id="comment-form" novalidate>
          <div class="form-grid">
            <div class="field">
              <label class="field-label" for="comment-name">Seu nome</label>
              <input class="input" id="comment-name" name="name" type="text" maxlength="48" autocomplete="name" placeholder="Como quer ser chamado?" required>
            </div>
            <div class="field">
              <label class="field-label" for="comment-body">Sua mensagem</label>
              <textarea class="input" id="comment-body" name="body" rows="4" maxlength="800" placeholder="O que ficou com você?" required></textarea>
            </div>
          </div>
          <div class="form-footer">
            <button class="button" type="submit">Comentar <i data-lucide="arrow-up-right"></i></button>
          </div>
          <p class="form-status" id="comment-status" role="status" aria-live="polite" hidden></p>
        </form>

        <div class="comments-list" id="comments-list"></div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
  <script type="module" src="/src/pages/post.ts"></script>
</body>
</html>
